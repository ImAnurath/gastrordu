<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Dancing+Script:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#F4F0E5;color:#16263F;font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:#5C7A2E;color:#F4F0E5;}
  a{color:inherit;}
  @keyframes revealUp{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</helmet>
<div style="background:#F4F0E5;">
  <dc-import name="Header" active="haberler" hint-size="100%,120px"></dc-import>

  <section style="background:#16263F;color:#EDE7D6;">
    <div style="max-width:1440px;margin:0 auto;padding:clamp(44px,5vw,68px) 28px;">
      <div style="font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;color:#9DB36A;margin-bottom:14px;"><a href="Ordu Gastronomi Festivali.dc.html" style="text-decoration:none;color:#9DB36A;">ANASAYFA</a> · HABERLER</div>
      <h1 style="margin:0;font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(38px,5.5vw,66px);line-height:1;color:#F4F0E5;">Haberler</h1>
    </div>
  </section>

  <section style="max-width:1440px;margin:0 auto;padding:clamp(56px,7vw,90px) 28px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;">
      <sc-for list="{{ news }}" as="n" hint-placeholder-count="6">
        <a href="#" style="text-decoration:none;display:block;background:#FCFBF6;border:1px solid #E4DDC9;border-radius:16px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease;animation:revealUp both;animation-timeline:view();animation-range:entry 0% cover 26%;" style-hover="transform:translateY(-5px);box-shadow:0 18px 34px -22px rgba(22,38,63,.45);">
          <div style="position:relative;width:100%;aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#E4DDC9,#E4DDC9 11px,#ECE6D6 11px,#ECE6D6 22px);">
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:12px;color:#8A8062;">haber görseli</span>
          </div>
          <div style="padding:22px 24px 26px;">
            <div style="font-family:'Archivo',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.08em;color:#B07A33;text-transform:uppercase;">{{ n.date }}</div>
            <div style="font-family:'Archivo',sans-serif;font-weight:700;font-size:19px;line-height:1.3;color:#16263F;margin:10px 0 10px;">{{ n.title }}</div>
            <div style="font-family:'Source Serif 4',serif;font-size:15px;line-height:1.55;color:#5A6B7E;">{{ n.excerpt }}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      news: [
        { date: '12 Temmuz 2026', title: 'Ordu Gastronomi Festivali İçin Geri Sayım Başladı', excerpt: 'Tayfun Gürsoy Parkı, iki gün sürecek lezzet şölenine hazırlanıyor.' },
        { date: '8 Temmuz 2026', title: 'Stant Başvuruları Tüm Yurttan İlgi Görüyor', excerpt: 'Kooperatifler ve üreticilerden yoğun başvuru talebi geliyor.' },
        { date: '2 Temmuz 2026', title: "Karadeniz'in Şefleri Ordu'da Buluşuyor", excerpt: 'Workshop programında yöresel mutfak ön planda olacak.' },
        { date: '28 Haziran 2026', title: 'Festival Sahnesinde Sürpriz Konserler', excerpt: 'İki gece boyunca ana sahnede müzik dolu bir program sizi bekliyor.' },
        { date: '20 Haziran 2026', title: 'Çocuk Köyü ile Miniklere Özel Alan', excerpt: 'Atölyeler, oyunlar ve gösterilerle dolu çocuk programı açıklandı.' },
        { date: '14 Haziran 2026', title: 'Ordu Fındığı Coğrafi İşaretiyle Sahnede', excerpt: 'Yörenin tescilli ürünleri festival boyunca tanıtılacak.' }
      ]
    };
  }
}
</script>
</body>
</html>
